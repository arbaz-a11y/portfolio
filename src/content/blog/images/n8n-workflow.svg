<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="928" height="392" rx="12" fill="#0f1418" stroke="#33404a" stroke-width="1.5"/>
  <rect x="16" y="16" width="928" height="40" rx="12" fill="#181f26"/>
  <rect x="16" y="52" width="928" height="10" fill="#181f26"/>
  <line x1="16" y1="56" x2="944" y2="56" stroke="#232c34" stroke-width="1.5"/>
  <circle cx="40" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="60" cy="36" r="6" fill="#febc2e"/>
  <circle cx="80" cy="36" r="6" fill="#28c840"/>
  <text x="480" y="42" text-anchor="middle" fill="#8b97a3" font-size="13">workflow.n8n — Editor</text>

  <rect x="16" y="56" width="928" height="352" fill="url(#dots)"/>

  <!-- connections -->
  <line x1="252" y1="233" x2="276" y2="233" stroke="#5b6b78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="472" y1="233" x2="496" y2="233" stroke="#5b6b78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 690 210 L 705 210 L 705 148 L 716 148" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <path d="M 690 256 L 705 256 L 705 318 L 716 318" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="695" y="202" fill="#4ade80" font-size="11">yes</text>
  <text x="695" y="292" fill="#f87171" font-size="11">no</text>

  <!-- Trigger -->
  <rect x="60" y="195" width="190" height="76" rx="10" fill="#12181e" stroke="#33404a" stroke-width="1.5"/>
  <circle cx="82" cy="217" r="4" fill="#4ade80"/>
  <text x="96" y="222" fill="#dee3e8" font-size="15" font-weight="600">Trigger</text>
  <text x="78" y="247" fill="#8b97a3" font-size="12">webhook · schedule · manual</text>

  <!-- HTTP Request -->
  <rect x="280" y="195" width="190" height="76" rx="10" fill="#12181e" stroke="#33404a" stroke-width="1.5"/>
  <circle cx="302" cy="217" r="4" fill="#38bdf8"/>
  <text x="316" y="222" fill="#dee3e8" font-size="15" font-weight="600">HTTP Request</text>
  <text x="298" y="247" fill="#8b97a3" font-size="12">fetch data from an API</text>

  <!-- IF -->
  <rect x="500" y="195" width="190" height="76" rx="10" fill="#12181e" stroke="#33404a" stroke-width="1.5"/>
  <circle cx="522" cy="217" r="4" fill="#fbbf24"/>
  <text x="536" y="222" fill="#dee3e8" font-size="15" font-weight="600">IF / Branch</text>
  <text x="518" y="247" fill="#8b97a3" font-size="12">did the request return data?</text>

  <!-- Telegram -->
  <rect x="720" y="110" width="190" height="76" rx="10" fill="#12181e" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="742" cy="132" r="4" fill="#38bdf8"/>
  <text x="756" y="137" fill="#dee3e8" font-size="15" font-weight="600">Telegram</text>
  <text x="738" y="162" fill="#8b97a3" font-size="12">notify the channel</text>

  <!-- Sheets -->
  <rect x="720" y="280" width="190" height="76" rx="10" fill="#12181e" stroke="#44e2cd" stroke-width="1.5"/>
  <circle cx="742" cy="302" r="4" fill="#44e2cd"/>
  <text x="756" y="307" fill="#dee3e8" font-size="15" font-weight="600">Google Sheets</text>
  <text x="738" y="332" fill="#8b97a3" font-size="12">append a row of results</text>
</svg>
